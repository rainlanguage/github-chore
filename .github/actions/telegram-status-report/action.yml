name: Telegram CI Status Reporter
description: 'Reports the CI workflow status to telegram'

branding:
  icon: 'alert-triangle'
  color: 'red'

inputs:
  status:
    description: Job status (success, failure, cancelled)
    required: true
  job_name:
    description: Job name to display
    required: false
    default: ""
  message:
    description: Extra message to append
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: "${{ github.action_path }}/notify.sh"
      env:
        STATUS: ${{ inputs.status }}
        JOB_NAME: ${{ inputs.job_name }}
        EXTRA_MESSAGE: ${{ inputs.message }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        GITHUB_JOB: ${{ github.job }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}