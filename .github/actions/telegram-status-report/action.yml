name: Telegram CI Status Reporter
description: 'Reports the CI workflow status to telegram'

branding:
  icon: 'alert-triangle'
  color: 'red'

inputs:
  status:
    description: Job status (success, failure, cancelled)
    required: true
  job-name:
    description: Job name to display
    required: false
    default: ""
  message:
    description: Extra message to append
    required: false
    default: ""
  telegram-bot-token:
    description: Telegram bot API token
    required: true
  telegram-chat-id:
    description: The telegram channel ID to send reports to
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: "${{ github.action_path }}/reporter.sh"
      env:
        STATUS: ${{ inputs.status }}
        JOB_NAME: ${{ inputs.job-name }}
        EXTRA_MESSAGE: ${{ inputs.message }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram-bot-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram-chat-id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        GITHUB_JOB: ${{ github.job }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}